<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            color: #222;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background-color: #1f2937;
            color: white;
            padding: 24px 16px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #374151;
            color: white;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background-color: white;
            height: 70px;
            padding: 0 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #2563eb;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 26px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .contacts-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f9fafb;
            color: #555;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .contact-name {
            font-weight: bold;
        }

        .logout-button {
            border: none;
            background: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .content {
                padding: 20px;
            }

            table {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <h2>Contacts App</h2>

        <a href="#" class="active">Contacts</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
    </aside>

    <main class="main">

        <header class="topbar">

            <div>
                <strong>Dashboard</strong>
            </div>

            <div class="user-info">

                <div class="avatar">
                    AS
                </div>

                <div>
                    <div id="loggedInUser">Logged In User</div>
                    <button
                        class="logout-button"
                        id="logoutButton"
                    >
                        Log out
                    </button>
                </div>

            </div>

        </header>

        <section class="content">

            <div class="page-header">

                <div>
                    <h1>My Contacts</h1>
                    <p>Your saved contacts appear below.</p>
                </div>

                <button class="add-button">
                    + Add Contact
                </button>

            </div>

            <div class="contacts-card">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Company</th>
                        </tr>
                    </thead>

                    <tbody id="contactsTable">

                        <tr>
                            <td class="contact-name">Jane Doe</td>
                            <td>jane@example.com</td>
                            <td>555-123-4567</td>
                            <td>Example Corp</td>
                        </tr>

                        <tr>
                            <td class="contact-name">John Smith</td>
                            <td>john@example.com</td>
                            <td>555-987-6543</td>
                            <td>Smith LLC</td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script>

    const BASE_URL = "http://localhost:80";


    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            try {

                await fetch(`${BASE_URL}/api/logout`, {
                    method: "POST",
                    credentials: "include"
                });

                window.location.href = "login.html";

            } catch (error) {

                console.error("Logout failed:", error);

            }

        });

</script>

</body>
</html>
