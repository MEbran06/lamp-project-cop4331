<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Contact Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f6f8;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background-color: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 4px 18px
                rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 24px;
            font-weight: bold;

            color: #1f2937;

            margin-bottom: 30px;
        }

        h1 {
            text-align: center;

            font-size: 28px;

            color: #1f2937;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            padding: 12px 13px;

            border:
                1px solid
                #d1d5db;

            border-radius: 7px;

            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 2px
                rgba(37, 99, 235, 0.1);
        }

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 24px;

            font-size: 14px;
        }

        .remember-me {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #4b5563;
        }

        .forgot-password {
            color: #2563eb;

            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .login-button:disabled {
            background-color: #93c5fd;

            cursor: not-allowed;
        }

        .message {
            min-height: 20px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;
        }

        .message.error {
            color: #dc2626;
        }

        .message.success {
            color: #15803d;
        }

        .register-text {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 14px;
        }

        .register-text a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .login-container {
                margin: 20px;

                padding: 30px 25px;
            }
        }
    </style>
</head>


<body>

<div class="login-container">

    <div class="logo">
        Contact Manager
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to access your contacts.
    </p>


    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <div class="login-options">

            <label class="remember-me">

                <input
                    type="checkbox"
                    id="remember"
                >

                Remember me

            </label>

        </div>


        <button
            type="submit"
            id="loginButton"
            class="login-button"
        >
            Sign In
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>


    <p class="register-text">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</div>


<!-- Shared API functions -->
<script src="js/api.js"></script>

<!-- Login-specific JavaScript -->
<script src="js/login.js"></script>

</body>

</html>
