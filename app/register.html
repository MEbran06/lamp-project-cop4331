<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Contact Manager</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-logo">
        Contact Manager
    </div>

    <h1>Create Account</h1>

    <p class="auth-subtitle">
        Register to start managing your contacts.
    </p>


    <form id="registerForm">

        <div class="form-row">

            <div class="form-group">
                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter first name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="lastName">
                    Last Name
                </label>

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Enter last name"
                    required
                >
            </div>

        </div>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <button
            type="submit"
            id="registerButton"
            class="auth-button"
        >
            Create Account
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>


    <p class="auth-footer">

        Already have an account?

        <a href="login.html">
            Sign In
        </a>

    </p>

</div>


<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>

</html>
