<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Contact Manager</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="login-container">

    <div class="logo">
        Contact Manager
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Register for a new account.
    </p>


    <form id="registerForm">

        <div class="form-group">

            <label for="firstName">
                First Name
            </label>

            <input
                type="text"
                id="firstName"
                required
            >

        </div>


        <div class="form-group">

            <label for="lastName">
                Last Name
            </label>

            <input
                type="text"
                id="lastName"
                required
            >

        </div>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >

        </div>


        <button
            type="submit"
            id="registerButton"
            class="login-button"
        >
            Register
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </form>


    <p class="register-text">

        Already have an account?

        <a href="login.html">
            Sign In
        </a>

    </p>

</div>


<script src="js/api.js"></script>
<script src="js/register.js"></script>

</body>

</html>
